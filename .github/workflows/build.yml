name: build-kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: defconfig name
        default: dandelion_defconfig
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 python2 cpio zip unzip device-tree-compiler
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Clone kernel
        run: git clone --depth 1 -b dandelion-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git k

      - name: Toolchain
        run: git clone --depth 1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fix assembler and linker
        run: |
          cd clang/bin
          ln -sf aarch64-linux-gnu-as as
          ln -sf aarch64-linux-gnu-ld ld
          ./as --version | head -1
          ./ld --version | head -1

      - name: Apply patches
        working-directory: k
        run: |
          set -e
          for p in ../patches/*.patch; do [ -f "$p" ] && git apply --verbose "$p"; done || true
          [ -f ../patches/apply.sh ] && bash ../patches/apply.sh
          git diff --stat

      - name: Build
        shell: bash
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          T="$PWD/clang/bin"
          export PATH="$PATH:$T"
          cd k
          MK=(make O=out ARCH=arm64
            "CC=$T/clang -fuse-ld=lld -Wno-unknown-warning-option -Wno-unused-command-line-argument"
            "LD=$T/aarch64-linux-gnu-ld" "AR=$T/llvm-ar" "NM=$T/llvm-nm" "OBJCOPY=$T/llvm-objcopy"
            "OBJDUMP=$T/llvm-objdump" "STRIP=$T/llvm-strip"
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            "HOSTCC=gcc -fcommon" "HOSTCXX=g++ -fcommon" HOSTLD=/usr/bin/ld
            KCFLAGS=-Wno-error)
          "${MK[@]}" "$DEFCONFIG"
          "${MK[@]}" -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Diagnose
        if: failure()
        shell: bash
        run: |
          grep -n -E "error|Error|undefined" build.log | head -30 || true
          echo "--- tail"
          tail -30 build.log || true

      - name: Magiskboot
        run: |
          curl -sL -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -j magisk.apk lib/x86_64/libmagiskboot.so -d mb
          mv mb/libmagiskboot.so magiskboot && chmod +x magiskboot

      - name: Repack boot
        run: |
          [ -f stock/boot.img ] || { [ -f stock/boot.zip ] && unzip -o stock/boot.zip -d stock; }
          [ -f stock/boot.img ] || { echo "stock/boot.img or stock/boot.zip missing"; exit 1; }
          mkdir r && cp stock/boot.img r/boot.img && cd r
          ../magiskboot unpack boot.img
          ls -la
          B=../k/out/arch/arm64/boot
          if [ -f dtb ]; then
            cp $B/Image kernel
          else
            echo "WARNING: no separate dtb in stock boot, appending built dtbs"
            cat $B/Image $(ls $B/dts/mediatek/*.dtb | head -1) > kernel
          fi
          ../magiskboot repack boot.img ../boot_new.img

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-out
          path: |
            boot_new.img
            build.log
