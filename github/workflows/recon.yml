name: recon
on: workflow_dispatch
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Clone kernel
        run: git clone --depth 1 -b dandelion-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git k
      - name: Kernel version and defconfigs
        run: |
          cd k
          grep -n -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile | head -3
          ls arch/arm64/configs | grep -i -E "dandelion|k62|mt67|blossom"
      - name: Panel driver files
        run: cd k && grep -ril "icnl9911c" . | head -20
      - name: Panel timings
        run: |
          cd k
          for f in $(grep -ril "icnl9911c" drivers/misc/mediatek/lcm 2>/dev/null | head -5); do
            echo "=== $f"
            grep -n -i -E "PLL_CLOCK|vertical_|horizontal_|frame_rate|data_rate|fps|ssc" "$f" | head -60
          done
      - name: GPU freq table
        run: |
          cd k
          grep -rln "gpufreq_opp_dump" drivers | head
          grep -rn -E "650000|680000" drivers/misc/mediatek --include=*.c --include=*.h | grep -i -E "gpu|opp|freq" | head -40
      - name: GPU segment selection
        run: |
          cd k
          grep -rn -i -E "segment|efuse|SEG_" drivers/misc/mediatek/gpufreq* drivers/misc/mediatek/gpu 2>/dev/null | head -40
      - name: CPU freq table
        run: |
          cd k
          grep -rn -E "2300000|2000000|2001000" drivers/misc/mediatek --include=*.c --include=*.h | grep -i -E "cpu|opp|freq" | head -40
